[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "landrop"
version = "0.2.0"
description = "Python transfer service for LANDrop desktop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "paramiko>=3.4,<5",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]
dev = [
    "pytest>=8,<9",
    "pyinstaller>=6.8,<7",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
]

[project.scripts]
landrop-service = "landrop.api.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
